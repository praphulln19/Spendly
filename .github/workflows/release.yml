name: Build and release Spendly

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check the app
        working-directory: frontend
        run: npm run typecheck
      - name: Export the web app
        working-directory: frontend
        run: npm run build:web
      - name: Package the web build
        run: cd frontend && zip -r ../spendly-web-${{ github.run_number }}.zip dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-v${{ github.run_number }}
          name: Spendly web build ${{ github.run_number }}
          generate_release_notes: true
          files: spendly-web-${{ github.run_number }}.zip

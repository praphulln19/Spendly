<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Spendly">
  <!--
    Pace: three descending pills, the day strip that leads the Today screen.
    A fixed amount stepping down across the days it has to cover.

    Solid shapes rather than strokes, so nothing thins out on the way down to a
    16px favicon. Corner radius is 23.4% to match the iOS squircle.
  -->
  <rect width="512" height="512" rx="120" fill="#000000"/>
  <g fill="#FFFFFF">
    <rect x="112" y="160" width="76" height="224" rx="38"/>
    <rect x="218" y="216" width="76" height="168" rx="38"/>
    <rect x="324" y="272" width="76" height="112" rx="38"/>
  </g>
</svg>
